name: Build & Release Tauri App

on:
  push:
    tags:
      - 'v*'          # Trigger saat push tag seperti v1.0.0
  workflow_dispatch:   # Bisa trigger manual dari GitHub UI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      # ── 1. Checkout kode ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'          # Cache node_modules

      # ── 3. Setup Rust ─────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust build (mempercepat build berikutnya)
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 4. Install Linux system dependencies ──────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      # ── 5. Install frontend dependencies ──────────────
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci              # ci lebih strict & reproducible dari install

      # ── 6. Build Tauri ────────────────────────────────
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## Changes
            See commits for details.
            
            ## Downloads
            - **Windows**: `.msi` atau `.exe`
            - **macOS**: `.dmg`
            - **Linux**: `.deb` atau `.AppImage`
          releaseDraft: true       # Draft dulu, publish manual
          prerelease: false
          args: --target ${{ matrix.target }}