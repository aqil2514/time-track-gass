deploy_server:
  stage: deploy
  image: node:20
  needs: ["deploy_web"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/fresh-start"'
  before_script:
    - apt-get update && apt-get install -y openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - npm --prefix apps/server ci
    - npm --prefix apps/server run build
    - rsync -az -e "ssh -i ~/.ssh/deploy_key" apps/server/dist apps/server/package.json apps/server/package-lock.json "$VPS_USER@$VPS_HOST:/www/wwwroot/time-track-gass/server/"
    - ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd /www/wwwroot/time-track-gass/server && npm ci --omit=dev && pm2 restart timetrack"
