version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: timetrack-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetrack123}
      POSTGRES_DB: ${POSTGRES_DB:-timetrack}
    volumes:
      - timetrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: timetrack-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-timetrack}:${POSTGRES_PASSWORD:-timetrack123}@db:5432/${POSTGRES_DB:-timetrack}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4/}
      ZAI_VISION_MODEL_PRIMARY: ${ZAI_VISION_MODEL_PRIMARY:-glm-4.6v}
      ZAI_VISION_MODEL_FALLBACK: ${ZAI_VISION_MODEL_FALLBACK:-glm-4-flash}
      ZAI_TEXT_MODEL_FAST: ${ZAI_TEXT_MODEL_FAST:-glm-4.7-flashx}
      ZAI_TEXT_MODEL_SMART: ${ZAI_TEXT_MODEL_SMART:-glm-4.7}
      ZAI_MAX_INLINE_RETRIES: ${ZAI_MAX_INLINE_RETRIES:-2}
      ZAI_MAX_QUEUE_RETRIES: ${ZAI_MAX_QUEUE_RETRIES:-5}
      RETRY_QUEUE_WORKERS: ${RETRY_QUEUE_WORKERS:-3}
      RETRY_QUEUE_INTERVAL: ${RETRY_QUEUE_INTERVAL:-10s}
      ENABLE_SESSIONS: ${ENABLE_SESSIONS:-true}
      ENABLE_DAILY_SUMMARY: ${ENABLE_DAILY_SUMMARY:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:1420}
      GIN_MODE: ${GIN_MODE:-release}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  timetrack-db-data:
