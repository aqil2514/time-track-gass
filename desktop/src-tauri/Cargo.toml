[package]
name = "timetrack-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "timetrack_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
open = "5"
xcap = "0.0.14"
image = "0.25"
webp = "0.3"
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"

[features]
default = []
